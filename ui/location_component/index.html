<!doctype html><html><head><meta charset="utf-8"><style>
body{font:14px sans-serif;margin:0;color:#cbd5e1}button{background:#087e99;color:white;border:0;border-radius:8px;padding:11px;cursor:pointer}p{font-size:12px}
</style></head><body><button id="loc">Use current location</button><p id="msg"></p>
<script>
function send(type,extra){parent.postMessage(Object.assign({isStreamlitMessage:true,type},extra||{}),"*");}
send("streamlit:componentReady",{apiVersion:1});send("streamlit:setFrameHeight",{height:88});
document.getElementById("loc").onclick=function(){
 let msg=document.getElementById("msg");msg.textContent="Waiting for location permission…";
 if(!navigator.geolocation){msg.textContent="Location unavailable. Please search for your city.";return;}
 navigator.geolocation.getCurrentPosition(p=>{
  msg.textContent="Location found. Confirm it below.";
  send("streamlit:setComponentValue",{value:{latitude:p.coords.latitude,longitude:p.coords.longitude,
   accuracy:p.coords.accuracy,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,nonce:Date.now()},dataType:"json"});
 },()=>{msg.textContent="Location unavailable or permission denied. Please use city search."},
 {enableHighAccuracy:false,timeout:10000,maximumAge:60000});
};
</script></body></html>
